<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">AI Image Disclosure</title>
  <defs>
    <linearGradient id="tile" x1="72" y1="24" x2="440" y2="488" gradientUnits="userSpaceOnUse"><stop stop-color="#202C63"/><stop offset=".48" stop-color="#121832"/><stop offset="1" stop-color="#080C1A"/></linearGradient>
    <radialGradient id="tileGlow" cx="0" cy="0" r="1" gradientTransform="translate(255 206) rotate(90) scale(270)" gradientUnits="userSpaceOnUse"><stop stop-color="#746BDE" stop-opacity=".29"/><stop offset="1" stop-color="#11162D" stop-opacity="0"/></radialGradient>
    <linearGradient id="blue" x1="105" y1="136" x2="298" y2="335" gradientUnits="userSpaceOnUse"><stop stop-color="#55A8FA"/><stop offset="1" stop-color="#3979EC"/></linearGradient>
    <linearGradient id="violet" x1="145" y1="164" x2="356" y2="382" gradientUnits="userSpaceOnUse"><stop stop-color="#A57CF2"/><stop offset="1" stop-color="#7858DF"/></linearGradient>
    <linearGradient id="pink" x1="196" y1="196" x2="416" y2="405" gradientUnits="userSpaceOnUse"><stop stop-color="#ED67BD"/><stop offset="1" stop-color="#D94DA8"/></linearGradient>
    <linearGradient id="mountain" x1="215" y1="286" x2="370" y2="407" gradientUnits="userSpaceOnUse"><stop stop-color="#F58ACD"/><stop offset="1" stop-color="#E86CBD"/></linearGradient>
    <radialGradient id="badge" cx="0" cy="0" r="1" gradientTransform="translate(382 367) rotate(45) scale(67)" gradientUnits="userSpaceOnUse"><stop stop-color="#A28AF5"/><stop offset="1" stop-color="#7457DF"/></radialGradient>
    <clipPath id="imageClip"><rect x="178" y="184" width="254" height="232" rx="54"/></clipPath>
    <filter id="blur" x="40" y="72" width="430" height="390" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="softShadow" x="58" y="92" width="418" height="380" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#050817" flood-opacity=".34"/></filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#tile)"/>
  <rect width="512" height="512" rx="104" fill="url(#tileGlow)"/>

  <g opacity=".42" filter="url(#blur)">
    <rect x="92" y="126" width="220" height="220" rx="52" fill="#438FFF"/>
    <rect x="132" y="154" width="240" height="240" rx="56" fill="#8E68F0"/>
    <rect x="178" y="184" width="254" height="232" rx="54" fill="#EB59B6"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="92" y="126" width="220" height="220" rx="52" fill="url(#blue)"/>
    <rect x="132" y="154" width="240" height="240" rx="56" fill="url(#violet)"/>
    <rect x="178" y="184" width="254" height="232" rx="54" fill="url(#pink)"/>
    <g clip-path="url(#imageClip)">
      <circle cx="264" cy="247" r="27" fill="#F9CCE5"/>
      <path d="M168 382 226 321c10-11 27-11 37 0l28 31 55-66c10-12 29-12 39 1l58 72v68H168Z" fill="url(#mountain)"/>
    </g>
    <circle cx="390" cy="374" r="48" fill="url(#badge)"/>
    <circle cx="390" cy="374" r="18" fill="#F5F0FF"/>
  </g>
</svg>
