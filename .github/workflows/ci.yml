name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build documentation
        run: pnpm docs:build

  dotnet:
    name: .NET (Umbraco ${{ matrix.umbraco-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        umbraco-version:
          - 17.1.0
          - 17.*
          - 18.*
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: >-
          dotnet test tests/TheBuilder.AIImageDisclosure.Tests/TheBuilder.AIImageDisclosure.Tests.csproj
          --configuration Release
          '-p:UmbracoVersion=${{ matrix.umbraco-version }}'

  openai:
    name: OpenAI integration (Umbraco ${{ matrix.umbraco-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - umbraco-version: 17.5.0
            ai-version: 17.3.0
          - umbraco-version: 18.1.1
            ai-version: 18.3.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test optional integration
        run: >-
          dotnet test tests/TheBuilder.AIImageDisclosure.OpenAI.Tests/TheBuilder.AIImageDisclosure.OpenAI.Tests.csproj
          --configuration Release
          '-p:UmbracoVersion=${{ matrix.umbraco-version }}'
          '-p:UmbracoAiCoreVersion=${{ matrix.ai-version }}'

  package:
    name: Sample and package
    needs:
      - docs
      - dotnet
      - openai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build sample
        run: dotnet build samples/TheBuilder.AIImageDisclosure.Example/TheBuilder.AIImageDisclosure.Example.csproj --configuration Release
      - name: Build sample with OpenAI integration
        run: dotnet build samples/TheBuilder.AIImageDisclosure.Example/TheBuilder.AIImageDisclosure.Example.csproj --configuration Release -p:IncludeOpenAiSample=true -p:UmbracoAiCoreVersion=18.3.0
      - name: Pack
        run: dotnet pack src/TheBuilder.AIImageDisclosure/TheBuilder.AIImageDisclosure.csproj --configuration Release --output artifacts
      - name: Pack optional OpenAI integration
        run: dotnet pack src/TheBuilder.AIImageDisclosure.OpenAI/TheBuilder.AIImageDisclosure.OpenAI.csproj --configuration Release --output artifacts
      - name: Validate archives
        run: for package in artifacts/*.nupkg; do unzip -t "$package"; done
      - name: Restore package in an Umbraco 17.1 consumer
        run: |
          dotnet new classlib --name PackageConsumer --output /tmp/package-consumer --framework net10.0
          dotnet nuget add source "$GITHUB_WORKSPACE/artifacts" --name ai-image-disclosure-artifacts
          dotnet add /tmp/package-consumer/PackageConsumer.csproj package Umbraco.Cms.Web.Common --version 17.1.0
          dotnet add /tmp/package-consumer/PackageConsumer.csproj package TheBuilder.AIImageDisclosure --version 0.1.0
          dotnet restore /tmp/package-consumer/PackageConsumer.csproj
      - name: Restore optional package in an Umbraco 17.5 consumer
        run: |
          dotnet add /tmp/package-consumer/PackageConsumer.csproj package Umbraco.Cms.Web.Common --version 17.5.0
          dotnet add /tmp/package-consumer/PackageConsumer.csproj package TheBuilder.AIImageDisclosure.OpenAI --version 0.1.0
          dotnet restore /tmp/package-consumer/PackageConsumer.csproj
